name: digits_affine
description: crop + rotation + slant / shift / zoom, no photometric jitter, for grey
  handwritten digits
ops:
- random_resized_crop:
    scale:
    - 0.7
    - 1.0
    ratio:
    - 0.8
    - 1.25
- random_rotation:
    max_degrees: 15
- random_affine:
    shear_degrees: 15
    translate: 0.07
    scale:
    - 0.9
    - 1.1
