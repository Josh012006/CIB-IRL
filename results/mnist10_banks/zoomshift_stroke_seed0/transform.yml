name: digits_zoomshift_stroke
description: digits_zoomshift + random stroke thickness, for grey handwritten digits
ops:
- random_rotation:
    max_degrees: 8
- random_affine:
    shear_degrees: 8
    translate: 0.05
    scale:
    - 0.9
    - 1.1
- random_stroke_width:
    max_strength: 0.5
    p: 0.5
