name: digits
description: crop + small rotation + brightness / contrast jitter, for grey handwritten
  digits
ops:
- random_resized_crop:
    scale:
    - 0.7
    - 1.0
    ratio:
    - 0.8
    - 1.25
- random_rotation:
    max_degrees: 15
- color_jitter:
    brightness: 0.2
    contrast: 0.2
    p: 0.8
