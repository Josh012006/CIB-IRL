# Bank for handwritten digits (MNIST-like, grey images). Fixed BEFORE any result was seen.
# Admission rule (configs/transforms/README.md): each operation preserves the identity of a digit by domain knowledge.
#   crop            as in `generic`: position and scale of the writing are not identity
#   rotation        +-15 degrees: the slant of the hand is not identity; far from the 6 <-> 9 confusion (180 degrees)
#   brightness/contrast   ink intensity is not identity
# No flip (a mirrored digit is another identity), no saturation, grayscale or hue (one channel).
name: digits
description: crop + small rotation + brightness / contrast jitter, for grey handwritten digits
ops:
  - random_resized_crop: {scale: [0.7, 1.0], ratio: [0.8, 1.25]}
  - random_rotation: {max_degrees: 15}
  - color_jitter: {brightness: 0.2, contrast: 0.2, p: 0.8}
