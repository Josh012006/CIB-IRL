# Variant 1 of the `digits` bank (docs/protocol-decisions.md 5.37), fixed BEFORE any result was seen.
# Written from what is known about handwritten digits, not from the labels:
#   removed   brightness / contrast jitter: the ink intensity of MNIST is nearly constant, so this invariance costs nothing and
#             does not move the representation towards the real variations of handwriting
#   added     slant (shear +-15 degrees), shift (+-2 pixels of 28) and zoom (0.9 to 1.1): the three things that change from one
#             writer to the next without changing the digit
#   kept      crop (position and scale) and rotation +-15 degrees, as in `digits`
# No flip. The bank is applied up to d_max = 2 times in a row: strengths compound (shear up to 30 degrees in two steps).
name: digits_affine
description: crop + rotation + slant / shift / zoom, no photometric jitter, for grey handwritten digits
ops:
  - random_resized_crop: {scale: [0.7, 1.0], ratio: [0.8, 1.25]}
  - random_rotation: {max_degrees: 15}
  - random_affine: {shear_degrees: 15, translate: 0.07, scale: [0.9, 1.1]}
