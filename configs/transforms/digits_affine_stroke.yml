# Variant 2 of the `digits` bank (docs/protocol-decisions.md 5.37): `digits_affine` + stroke width. Fixed BEFORE any result was seen.
#   added   stroke width: the pen thickness is a style, not an identity (half of the images are thickened, half thinned, by up
#           to half a pixel; 50 % of the applications leave the stroke alone)
name: digits_affine_stroke
description: digits_affine + random stroke thickness, for grey handwritten digits
ops:
  - random_resized_crop: {scale: [0.7, 1.0], ratio: [0.8, 1.25]}
  - random_rotation: {max_degrees: 15}
  - random_affine: {shear_degrees: 15, translate: 0.07, scale: [0.9, 1.1]}
  - random_stroke_width: {max_strength: 0.5, p: 0.5}
