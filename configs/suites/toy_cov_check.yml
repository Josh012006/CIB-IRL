# Checks after toy_cov (docs/protocol-decisions.md, 5.17): the covariance penalty on the intent (+ rho 0.1 + neg_floor 0.1, "fix")
# fixed 5 of the 6 seeds that had merged clusters. Every run goes to real convergence (label-free rule) or 300 epochs at most.
#   fix        seed 5 (the one that did not converge in toy_cov, now followed up to 300 epochs) and the 4 seeds of toy_rho
#              not yet replayed (2, 4, 6, 9)
#   lamX       the weight of the penalty, lambda_cov = X (10 in `fix`), on two seeds that the penalty fixed, 3 and 8 (the
#              two where the old default did worst: ACC 0.51 and 0.60) and on seed 5 for the 3 values 1, 3, 30
#              (is the penalty too strong, or too weak, where it fails?)
# Everything else as `fix`: rho = 0.1, neg_floor = 0.1.
#
#   python scripts/run_suite.py configs/suites/toy_cov_check.yml --cpu-count 2 --skip-existing
name: toy_cov_check
description: toy data, convergence or 300 epochs; fix on seeds 5, 2, 4, 6, 9; lambda_cov sweep on seeds 3 and 8 (and 5)
common:
  data: toy
  data_params: {spurious: 0.0}
  transform: toy_oracle
  configs: [configs/toy.yml]
  stop: {max_epochs: 300, min_epochs: 40}
  set: {intent_decorrelate: cov, rho: 0.1, neg_floor: 0.1}
experiments:
  - {name: fix, seeds: [5, 2, 4, 6, 9]}
  - {name: lam1,   seeds: [5, 3, 8], set: {intent_cov_weight: 1.0}}
  - {name: lam3,   seeds: [5, 3, 8], set: {intent_cov_weight: 3.0}}
  - {name: lam30,  seeds: [5, 3, 8], set: {intent_cov_weight: 30.0}}
  - {name: lam0.1, seeds: [3, 8],    set: {intent_cov_weight: 0.1}}
  - {name: lam100, seeds: [3, 8],    set: {intent_cov_weight: 100.0}}
